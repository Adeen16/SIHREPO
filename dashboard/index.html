<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PS145 Cyber Threat Detection Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>NTRO Cyber Threat Detection (PS145)</h1>
        <div class="status-indicator">
            <span id="connection-status" class="disconnected">Disconnected</span>
        </div>
    </header>
    
    <main>
        <section class="overview">
            <div class="card">
                <h2>Traffic Rate</h2>
                <div class="metric" id="traffic-rate">0 pkts/s</div>
            </div>
            <div class="card">
                <h2>Active Flows</h2>
                <div class="metric" id="active-flows">0</div>
            </div>
            <div class="card">
                <h2>Total Alerts</h2>
                <div class="metric" id="total-alerts">0</div>
            </div>
        </section>

        <section class="charts">
            <div class="card chart-container">
                <h2>Threat Distribution</h2>
                <canvas id="threatChart"></canvas>
            </div>
        </section>

        <section class="alerts">
            <div class="card">
                <h2>Recent Alerts</h2>
                <table id="alerts-table">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Flow ID</th>
                            <th>Threat Class</th>
                            <th>Confidence</th>
                        </tr>
                    </thead>
                    <tbody id="alerts-body">
                        <!-- Alerts will be inserted here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>
    
    <script src="app.js"></script>
</body>
</html>
