# Throughput target configuration
# These are TARGETS only. The benchmark script measures actuals and
# writes measured values to reports/throughput.json.
# No fabricated numbers are used.

[throughput]
# Target: passive ingestion + feature extraction + inference per packet
target_packets_per_sec = 10000
target_flows_per_sec   = 1000
target_inference_ms    = 5.0          # end-to-end per window
target_e2e_latency_ms  = 50.0         # packet-in → alert-out

[benchmark]
# Use a non-NTRO PCAP from dev/val set, or the controlled test pcap
pcap_path = tests/fixtures/test_traffic.pcap
# Window + slide used during benchmark (must match runtime defaults)
window_seconds = 5.0
slide_seconds  = 1.0
max_packets    = 50000
